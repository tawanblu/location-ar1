<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ganesha AR — อัญเชิญเฉพาะพื้นที่</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        :root { --gold: #d4a843; --gold-light: #f0c96b; --deep: #1a0a00; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; overflow: hidden; background-color: #000; }
        #main-menu-ui { position: absolute; inset: 0; z-index: 999; background: var(--deep); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        #main-menu-ui.hide { opacity: 0; pointer-events: none; }
        #close-ar-btn { position: fixed; top: 20px; left: 20px; z-index: 1000; background: rgba(26, 10, 0, 0.8); border: 1px solid var(--gold); color: var(--gold-light); padding: 10px 20px; border-radius: 50px; font-weight: 600; display: none; cursor: pointer; }
        #ar-controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; display: none; flex-wrap: wrap; justify-content: center; width: 90%; gap: 10px; }
        .control-btn { background: rgba(26, 10, 0, 0.85); border: 1px solid var(--gold); color: var(--gold-light); padding: 10px 18px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        #ar-hint { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(212, 168, 67, 0.4); color: var(--gold-light); padding: 8px 16px; border-radius: 20px; font-size: 13px; display: none; }
        .bg-gradient { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(196, 64, 10, 0.25) 0%, transparent 70%), linear-gradient(180deg, #0d0400 0%, #1a0800 50%, #0d0200 100%); z-index: 0; }
        .card { position: relative; z-index: 10; width: min(90vw, 400px); display: flex; flex-direction: column; align-items: center; }
        .card-inner { background: linear-gradient(170deg, #1e0c00 0%, #0f0400 100%); border: 1px solid rgba(212, 168, 67, 0.35); border-radius: 28px; padding: 40px 30px; text-align: center; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8); width: 100%; }
        .deity-icon { color: whitesmoke; font-size: 52px; margin-bottom: 6px; display: block; }
        .title-main { font-family: 'Cinzel Decorative', serif; font-size: 26px; font-weight: 900; color: var(--gold-light); }
        .btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #c4400a 0%, #7a1a0a 100%); border: 1px solid rgba(212, 168, 67, 0.5); border-radius: 16px; color: var(--gold-light); font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:disabled { background: #333; color: #777; cursor: not-allowed; }
        #location-status { font-size: 12px; margin-top: 10px; font-weight: 600; }
        .status-success { color: #4CAF50; }
        .status-fail { color: #FF5252; }
        .arjs-loader { display: none !important; }
    </style>
</head>

<body>
    <div id="main-menu-ui">
        <div class="bg-gradient"></div>
        <div class="card">
            <div class="card-inner">
                <span class="deity-icon">ॐ</span>
                <div class="title-main">Ganesha AR</div>
                <div class="description" id="info-text" style="color:rgba(253, 240, 208, 0.7); margin: 15px 0; font-size: 14px;">
                    กรุณาอนุญาตพิกัดเพื่อตรวจสอบตำแหน่ง
                </div>
                <button class="btn" id="start-btn" onclick="startAR()" disabled>✦ รอตรวจสอบตำแหน่ง...</button>
                <div id="location-status" style="color: var(--gold);">กำลังค้นหาตำแหน่ง...</div>
            </div>
        </div>
    </div>

    <button id="close-ar-btn" onclick="stopAR()">❮ ปิดกล้อง</button>
    <div id="ar-hint">💡 หันกล้องไปที่ป้ายสัญลักษณ์ Hiro</div>

    <div id="ar-controls">
        <button class="control-btn" id="audio-btn" onclick="toggleAudio()" style="background: rgba(122, 26, 10, 0.85);">🔇 เปิดเสียง</button>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false;" 
             vr-mode-ui="enabled: false" 
             renderer="colorManagement: true;">

        <a-assets>
            <video id="ganesha-video" src="AR_MOVE_SU01.mp4" 
                   preload="auto" loop="true" crossorigin="anonymous" 
                   playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-marker preset="hiro" id="markerA">
            <a-video src="#ganesha-video" 
             width="1.6" height="0.9" 
             position="0 0.1 0" 
             rotation="-90 0 0"
             material="transparent: true; blending: additive;"> 
            </a-video>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // --- ระบบ Geofencing ---
        const TARGET_LAT = 13.111352;
        const TARGET_LNG = 99.939209;
        const ALLOWED_RADIUS = 60000;


        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function checkLocation() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition((position) => {
                const distance = getDistance(position.coords.latitude, position.coords.longitude, TARGET_LAT, TARGET_LNG);
                const startBtn = document.getElementById('start-btn');
                const statusText = document.getElementById('location-status');
// ใส่สูตรโกง (true ||) ตรงนี้! เพื่อบังคับให้ผ่านเสมอ
                if (true || distance <= ALLOWED_RADIUS) {
                    statusText.innerText = "✓ ท่านอยู่ในพื้นที่กำหนดแล้ว (Dev Mode)";
                    statusText.className = "status-success";
                    startBtn.disabled = false;
                    startBtn.innerText = "✦ สแกนป้ายสัญลักษณ์ (AR)";
                } else {
                    statusText.innerText = `✗ ห่างจากจุดกำหนด ${Math.round(distance)} เมตร`;
                    statusText.className = "status-fail";
                }
            }, null, { enableHighAccuracy: true });
        }
        window.onload = checkLocation;

        // --- ระบบ Video AR Control ---
        const video = document.getElementById('ganesha-video');
        const audioBtn = document.getElementById('audio-btn');
        const marker = document.getElementById('markerA');

        // ฟังก์ชันควบคุมเสียงของวิดีโอ
        function toggleAudio() {
            if (video.muted) { 
                video.muted = false; 
                audioBtn.innerHTML = '🔊 ปิดเสียง'; 
            } else { 
                video.muted = true; 
                audioBtn.innerHTML = '🔇 เปิดเสียง'; 
            }
        }

        // เมื่อส่องเจอ Marker ให้เล่นวิดีโอ
        marker.addEventListener('markerFound', () => { 
            video.play(); 
        });

        // เมื่อมาร์กเกอร์หลุดกรอบกล้อง ให้หยุดเล่นวิดีโอ
        marker.addEventListener('markerLost', () => { 
            video.pause(); 
        });

        function startAR() {
            document.getElementById('main-menu-ui').classList.add('hide');
            document.getElementById('close-ar-btn').style.display = 'block';
            document.getElementById('ar-controls').style.display = 'flex';
            document.getElementById('ar-hint').style.display = 'block';

            // ทริกเกอร์วิดีโอ 1 ครั้งตอนผู้ใช้กดปุ่ม เพื่อปลดล็อคข้อจำกัดเบราว์เซอร์มือถือ
            video.play().then(() => {
                video.pause(); 
            }).catch(e => console.log("Video setup error:", e));
        }

        function stopAR() { 
            window.location.reload(); 
        }
    </script>
</body>
</html>

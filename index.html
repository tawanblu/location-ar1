<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Based AR</title>

    <!-- model-viewer (สำคัญมาก) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #distance {
            font-size: 18px;
            margin-top: 10px;
        }

        #arContainer {
            display: none;
            margin-top: 30px;
        }

        model-viewer {
            width: 100%;
            max-width: 350px;
            height: 350px;
            margin: auto;
        }

        .hint {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>📍 Location Based AR</h1>
    <p>เดินเข้าใกล้จุดเพื่อปลดล็อก AR</p>

    <div id="distance">กำลังตรวจสอบตำแหน่ง...</div>

    <!-- AR -->
    <div id="arContainer">

        <model-viewer src="model/AR_MOVE3.glb" ios-src="model/AR_Move2.usdz" ar ar-modes="scene-viewer quick-look webxr"
            camera-controls auto-rotate shadow-intensity="1">

            <button slot="ar-button"
                style="background:#007bff;color:white;border:none;padding:12px 20px;border-radius:50px;font-size:16px;">
                🚀 เปิด AR
            </button>

        </model-viewer>

        <div class="hint">กดปุ่ม AR เพื่อดูโมเดลในโลกจริง</div>
    </div>

    <script>

        // 📍 พิกัดเป้าหมาย
        const targetLat = 12.659111;
        const targetLng = 99.864299;

        // 🎯 ระยะ (เมตร)
        const radius = 1000; // ปรับได้ เช่น 50 / 100 / 200

        const distanceText = document.getElementById("distance");
        const arContainer = document.getElementById("arContainer");

        // 📏 คำนวณระยะ (Haversine)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        function checkLocation(position) {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;

            const distance = getDistance(userLat, userLng, targetLat, targetLng);

            distanceText.innerHTML =
                "📏 คุณอยู่ห่างจากจุด AR ประมาณ " +
                distance.toFixed(2) + " เมตร";

            if (distance <= radius) {
                arContainer.style.display = "block";
            } else {
                arContainer.style.display = "none";
            }
        }

        function error() {
            distanceText.innerHTML =
                "❌ ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาอนุญาต GPS";
        }

        // 📡 เริ่มตรวจ GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(checkLocation, error, {
                enableHighAccuracy: true
            });
        } else {
            distanceText.innerHTML = "❌ อุปกรณ์ไม่รองรับ GPS";
        }

    </script>

</body>

</html>

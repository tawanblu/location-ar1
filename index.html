<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ganesha AR — Image Tracking Mode</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <script>
        AFRAME.registerComponent('blue-screen', {
            init: function () {
                var videoEl = document.querySelector(this.el.getAttribute('material').src);
                if (!videoEl) return;
                var videoTexture = new THREE.VideoTexture(videoEl);
                videoTexture.minFilter = THREE.LinearFilter;
                var customMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        textureMap: { value: videoTexture },
                        keyColor: { value: new THREE.Color('#0000FF') },
                        similarity: { value: 0.35 },
                        smoothness: { value: 0.1 }
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                    fragmentShader: `
                        uniform sampler2D textureMap; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; varying vec2 vUv;
                        void main() {
                            vec4 videoColor = texture2D(textureMap, vUv);
                            float d = distance(videoColor.rgb, keyColor);
                            if (d < similarity) {
                                float alpha = smoothstep(similarity - smoothness, similarity, d);
                                gl_FragColor = vec4(videoColor.rgb, alpha);
                            } else { gl_FragColor = videoColor; }
                        }
                    `,
                    transparent: true
                });
                this.el.getObject3D('mesh').material = customMaterial;
            }
        });
    </script>

    <style>
        /* ใช้สไตล์เดิมที่คุณออกแบบไว้ได้เลย (ตัดมาเฉพาะส่วนสำคัญ) */
        :root {
            --gold: #d4a843;
            --gold-light: #f0c96b;
            --deep: #1a0a00;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #main-menu-ui {
            position: absolute;
            inset: 0;
            z-index: 999;
            background: var(--deep);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.5s;
        }

        #main-menu-ui.hide {
            opacity: 0;
            pointer-events: none;
        }

        .card-inner {
            background: linear-gradient(170deg, #1e0c00 0%, #0f0400 100%);
            border: 1px solid var(--gold);
            border-radius: 28px;
            padding: 40px;
            text-align: center;
            color: #fff;
            width: 350px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #c4400a 0%, #7a1a0a 100%);
            border: 1px solid var(--gold);
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #scanning-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--gold-light);
            z-index: 100;
            pointer-events: none;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <div id="main-menu-ui">
        <div class="card-inner">
            <span style="font-size: 50px;">ॐ</span>
            <h2>Ganesha AR</h2>
            <p id="location-info">กำลังตรวจสอบตำแหน่งพิกัด...</p>
            <button class="btn" id="start-btn" onclick="startAR()" disabled>กรุณารอตรวจสอบตำแหน่ง</button>
        </div>
    </div>

    <div id="scanning-overlay">
        <div style="text-align: center;">
            <iconify-icon icon="lucide:scan-eye" style="font-size: 50px;"></iconify-icon>
            <p>หันกล้องไปที่รูปภาพหน้าศาล</p>
        </div>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: no;" embedded
        vr-mode-ui="enabled: false">

        <a-assets>
            <video id="ganesha-video" src="AR_MOVE_SU01.mp4" loop="true" muted playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="ganesha-target">
            <a-entity geometry="primitive: plane; width: 1; height: 1.5" material="shader: flat; src: #ganesha-video"
                blue-screen></a-entity>
        </a-entity>
    </a-scene>

    <script>
        // --- ส่วนที่ 1: ระบบ Geofencing (ยกของเดิมคุณมาใช้) ---
        const TARGET_LAT = 13.111352;
        const TARGET_LNG = 99.939209;
        const ALLOWED_RADIUS = 100; // ปรับรัศมี (เมตร)

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const a = Math.sin(((lat2 - lat1) * Math.PI / 180) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(((lon2 - lon1) * Math.PI / 180) / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        window.onload = () => {
            navigator.geolocation.getCurrentPosition((pos) => {
                const dist = getDistance(pos.coords.latitude, pos.coords.longitude, TARGET_LAT, TARGET_LNG);
                const btn = document.getElementById('start-btn');
                const info = document.getElementById('location-info');

                // Dev Mode: บังคับให้ผ่านเสมอ หรือใช้พิกัดจริง
                if (true || dist <= ALLOWED_RADIUS) {
                    info.innerText = "✓ คุณอยู่ในพื้นที่ประกอบพิธีแล้ว";
                    btn.disabled = false;
                    btn.innerText = "เข้าสู่ระบบ AR";
                } else {
                    info.innerText = "✗ คุณไม่ได้อยู่ในพื้นที่มหาวิทยาลัย";
                }
            });
        };

        // --- ส่วนที่ 2: ระบบควบคุม AR ---
        const video = document.getElementById('ganesha-video');
        const scene = document.getElementById('ar-scene');
        const target = document.getElementById('ganesha-target');

        function startAR() {
            document.getElementById('main-menu-ui').classList.add('hide');
            document.getElementById('scanning-overlay').style.display = 'flex';

            // เริ่มการทำงานของ Mind-AR
            scene.systems["mindar-image-system"].start();

            // ปลดล็อกวิดีโอ (สำหรับ Mobile)
            video.play().then(() => video.pause());
        }

        target.addEventListener("targetFound", () => {
            video.play();
            document.getElementById('scanning-overlay').style.display = 'none';
        });

        target.addEventListener("targetLost", () => {
            video.pause();
            document.getElementById('scanning-overlay').style.display = 'flex';
        });
    </script>
</body>

</html>

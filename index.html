<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Viewer</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .ar-btn {
            display: inline-block;
            padding: 18px 35px;

            color: white;

            text-decoration: none;
            transition: 0.3s;
        }

        .ar-btn:hover {
            background: #0056b3;
        }

        .ar-btn i {
            margin-right: 10px;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Based AR</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
    padding: 40px 20px;
}

#distance {
    font-size: 18px;
    margin-top: 10px;
}

.ar-btn {
    padding: 15px 30px;
    background: #007bff;
    color: white;
    font-size: 18px;
    border-radius: 50px;
    border: none;
}
</style>
</head>

<body>

<h1>Location Based AR</h1>
<p>เดินเข้าใกล้จุดที่กำหนดเพื่อเปิด AR</p>

<div id="distance">กำลังตรวจสอบตำแหน่ง...</div>

<button id="arButton" class="ar-btn" style="display:none;">
    เปิด AR ทันที
</button>

<!-- ลิงก์ AR (ซ่อนเอาไว้) -->
<a id="arLink" rel="ar" href="AR_Move2.usdz" style="display:none;"></a>

<script>

const targetLat = 12.656167;
const targetLng = 99.868308;
const radius = 10000;

const distanceText = document.getElementById("distance");
const arButton = document.getElementById("arButton");
const arLink = document.getElementById("arLink");

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;

    const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
        Math.cos(φ1) * Math.cos(φ2) *
        Math.sin(Δλ / 2) * Math.sin(Δλ / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function checkLocation(position) {
    const userLat = position.coords.latitude;
    const userLng = position.coords.longitude;

    const distance = getDistance(userLat, userLng, targetLat, targetLng);

    distanceText.innerHTML =
        "คุณอยู่ห่างจากจุด AR ประมาณ " +
        distance.toFixed(2) + " เมตร";

    if (distance <= radius) {
        arButton.style.display = "inline-block";
    } else {
        arButton.style.display = "none";
    }
}

function error() {
    distanceText.innerHTML = "ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาอนุญาต GPS";
}

if (navigator.geolocation) {
    navigator.geolocation.watchPosition(checkLocation, error);
}

// 🔥 กดปุ่มแล้วเข้า AR ทันที
arButton.addEventListener("click", function() {
    arLink.click();
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Geofence - Fixed</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #status-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-weight: bold;
        }

        model-viewer {
            display: none;
        }

        /* ซ่อนตัว viewer หลักไว้ ใช้แค่เปิด AR */
    </style>
</head>

<body>

    <div id="status-box">
        <h3>📍 ตรวจสอบตำแหน่ง</h3>
        <p id="message">กำลังค้นหาตำแหน่ง GPS...</p>
        <button id="ar-btn" class="btn" onclick="openAR()">✅ วางโมเดล AR</button>
    </div>

    <model-viewer id="my-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz" ar
        ar-modes="webxr scene-viewer quick-look" camera-controls>
    </model-viewer>

    <script>
        const messageEl = document.getElementById('message');
        const arBtn = document.getElementById('ar-btn');

        // 1. ฟังก์ชันเช็คขอบเขตประเทศไทย
        function isInThailand(lat, lng) {
            return lat >= 5.5 && lat <= 20.5 && lng >= 97.0 && lng <= 105.5;
        }

        // 2. ตั้งค่าความแม่นยำสูง
        const options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        // 3. เริ่มทำงานเมื่อโหลดหน้าเว็บ
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    console.log(`Lat: ${userLat}, Lng: ${userLng}`);

                    if (isInThailand(userLat, userLng)) {
                        messageEl.innerHTML = `✅ พิกัด: ${userLat.toFixed(4)}, ${userLng.toFixed(4)}<br><span style="color:green">คุณอยู่ในพื้นที่ที่กำหนด</span>`;
                        arBtn.style.display = 'block'; // โชว์ปุ่ม
                    } else {
                        messageEl.innerHTML = `📍 พิกัด: ${userLat.toFixed(4)}, ${userLng.toFixed(4)}<br><span style="color:red">❌ ระบบนี้ใช้ได้เฉพาะในไทย</span>`;
                    }
                },
                (error) => {
                    messageEl.innerHTML = "⚠️ โปรดเปิด GPS และอนุญาตสิทธิ์เข้าถึงตำแหน่ง";
                    console.error(error);
                },
                options
            );
        } else {
            messageEl.innerHTML = "❌ อุปกรณ์ของคุณไม่รองรับ GPS";
        }

        // 4. ฟังก์ชันเปิด AR
        function openAR() {
            const modelViewer = document.getElementById('my-model');
            if (modelViewer.canActivateAR) {
                modelViewer.activateAR();
            } else {
                alert("อุปกรณ์นี้ไม่รองรับ AR");
            }
        }
    </script>
</body>

</html>
